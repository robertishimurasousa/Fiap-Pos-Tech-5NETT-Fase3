name: Testes e cobertura .NET

on:
  push:
    branches:
      - main
      - 'rob-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: xUnit e cobertura
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Obter o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar o SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Configurar Node.js para o Allure
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Restaurar dependências
        run: dotnet restore Escola.slnx

      - name: Verificar formatação C#
        run: dotnet format Escola.slnx --verify-no-changes --no-restore

      - name: Compilar
        id: build
        run: dotnet build Escola.slnx --configuration Release --no-restore -warnaserror

      - name: Executar testes unitários
        run: |
          dotnet test tests/Escola.UnitTests/Escola.UnitTests.csproj \
            --configuration Release --no-build --collect 'XPlat Code Coverage' \
            --results-directory TestResults/unit --logger 'trx;LogFileName=unit.trx' \
            -- xUnit.ReporterSwitch=allure

      - name: Executar testes HTTP
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          dotnet test tests/Escola.IntegrationTests/Escola.IntegrationTests.csproj \
            --configuration Release --no-build --collect 'XPlat Code Coverage' \
            --results-directory TestResults/integration --logger 'trx;LogFileName=integration.trx' \
            -- xUnit.ReporterSwitch=allure

      - name: Gerar relatório Allure
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx --yes allure@3.33.0 generate --clean

      - name: Publicar relatório e resultados Allure
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-allure
          path: |
            allure-report/
            allure-results/
          if-no-files-found: error

      - name: Gerar relatório consolidado
        run: |
          dotnet tool install dotnet-reportgenerator-globaltool --version 5.5.12 \
            --tool-path "$RUNNER_TEMP/reportgenerator"
          "$RUNNER_TEMP/reportgenerator/reportgenerator" \
            '-reports:TestResults/unit/*/coverage.cobertura.xml;TestResults/integration/*/coverage.cobertura.xml' \
            '-targetdir:TestResults/coverage' \
            '-filefilters:-**/obj/**' \
            '-reporttypes:Html;Cobertura;MarkdownSummaryGithub'
          cat TestResults/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar cobertura e resultados
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-dotnet
          path: |
            TestResults/coverage/
            TestResults/unit/unit.trx
            TestResults/unit/*/coverage.cobertura.xml
            TestResults/integration/integration.trx
            TestResults/integration/*/coverage.cobertura.xml
          if-no-files-found: error

  container-smoke:
    name: Smoke HTTP em Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Obter o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compilar a imagem da API
        run: docker build --tag escola-api:smoke .

      - name: Validar autenticação e cálculo no container
        run: python3 scripts/smoke-docker.py escola-api:smoke

  postman:
    name: Postman HTTP em Docker
    if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Obter o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Postman CLI
        run: |
          curl --fail --silent --show-error --location \
            https://dl-cli.pstmn.io/install/linux64.sh \
            --output "$RUNNER_TEMP/install-postman.sh"
          sh "$RUNNER_TEMP/install-postman.sh" --prefix "$RUNNER_TEMP/postman-cli" --no-modify-path
          echo "$RUNNER_TEMP/postman-cli/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/postman-cli/bin/postman" --version

      - name: Autenticar no Postman
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          if [ -z "$POSTMAN_API_KEY" ]; then
            echo '::error::Configure a secret POSTMAN_API_KEY no repositório.'
            exit 1
          fi
          postman login --with-api-key "$POSTMAN_API_KEY"

      - name: Compilar a imagem da API
        run: docker build --tag escola-api:postman .

      - name: Iniciar API isolada
        run: |
          signing_key="$(openssl rand -hex 32)"
          access_code="$(openssl rand -hex 32)"
          echo "::add-mask::$signing_key"
          echo "::add-mask::$access_code"
          echo "ESCOLA_JWT_CODIGO=$access_code" >> "$GITHUB_ENV"
          Jwt__ChaveAssinatura="$signing_key" Jwt__CodigoAcesso="$access_code" \
            docker run --detach --rm --name escola-postman \
            --publish 127.0.0.1::8080 \
            --env ASPNETCORE_ENVIRONMENT=Development \
            --env Jwt__ChaveAssinatura --env Jwt__CodigoAcesso \
            escola-api:postman
          endpoint="$(docker port escola-postman 8080/tcp)"
          echo "POSTMAN_BASE_URL=http://$endpoint" >> "$GITHUB_ENV"

      - name: Aguardar a API
        run: |
          curl --fail --silent --show-error --retry 60 --retry-delay 1 \
            --retry-connrefused --retry-all-errors --retry-max-time 60 --max-time 2 \
            --output /dev/null "$POSTMAN_BASE_URL/openapi/v1.json"

      - name: Executar coleção Postman
        id: collection
        run: |
          postman collection run "60078620-16e7c732-a558-476a-aa08-0a83c8d8c81b" \
            --environment "60078620-5b4e1266-d8e0-4c1c-b58f-b3952fcdd707" \
            --env-var "baseUrl=$POSTMAN_BASE_URL" \
            --env-var "codigoAcesso=$ESCOLA_JWT_CODIGO" \
            --env-var 'accessToken=' \
            --timeout-request 10000 --timeout-script 10000 --timeout 120000 \
            --reporters cli,junit --reporter-cli-no-console \
            --reporter-junit-export TestResults/postman/results.xml

      - name: Publicar resultados Postman
        if: ${{ !cancelled() && (steps.collection.outcome == 'success' || steps.collection.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-postman
          path: TestResults/postman/results.xml
          if-no-files-found: error

      - name: Remover container de teste
        if: ${{ always() }}
        run: |
          if docker container inspect escola-postman > /dev/null 2>&1; then
            docker rm --force escola-postman > /dev/null
          fi

  qodana-main:
    name: Qodana na main
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/qodana_code_quality.yml
    secrets:
      QODANA_TOKEN_181914213: ${{ secrets.QODANA_TOKEN_181914213 }}

  publish-image:
    name: Publicar imagem no GHCR
    needs: [test, container-smoke, postman, qodana-main]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-main
      cancel-in-progress: false

    steps:
      - name: Obter o código validado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Definir a referência da imagem
        run: |
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=ghcr.io/$repository" >> "$GITHUB_ENV"
          echo "IMAGE_SHA_TAG=ghcr.io/$repository:sha-$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Construir a imagem da revisão validada
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label 'org.opencontainers.image.title=Escola — API de Resultado Acadêmico' \
            --tag "$IMAGE_SHA_TAG" .

      - name: Validar a imagem antes de publicar
        run: python3 scripts/smoke-docker.py "$IMAGE_SHA_TAG"

      - name: Autenticar no GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

      - name: Publicar a tag do commit
        run: |
          docker push "$IMAGE_SHA_TAG"
          reference="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_SHA_TAG")"
          echo "IMAGE_DIGEST_REFERENCE=$reference" >> "$GITHUB_ENV"

      - name: Validar a imagem armazenada pelo digest
        run: |
          docker pull "$IMAGE_DIGEST_REFERENCE"
          revision="$(docker image inspect \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
            "$IMAGE_DIGEST_REFERENCE")"
          test "$revision" = "$GITHUB_SHA"
          python3 scripts/smoke-docker.py "$IMAGE_DIGEST_REFERENCE"

      - name: Atualizar a tag main se a revisão ainda for atual
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            docker tag "$IMAGE_DIGEST_REFERENCE" "$IMAGE_NAME:main"
            docker push "$IMAGE_NAME:main"
            echo "IMAGE_MAIN_UPDATED=true" >> "$GITHUB_ENV"
          else
            echo 'A main avançou; preservando a tag main e mantendo a imagem por SHA.'
            echo "IMAGE_MAIN_UPDATED=false" >> "$GITHUB_ENV"
          fi

      - name: Registrar referências da imagem
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          details = {
              "image": os.environ["IMAGE_NAME"],
              "shaTag": os.environ["IMAGE_SHA_TAG"],
              "digestReference": os.environ["IMAGE_DIGEST_REFERENCE"],
              "revision": os.environ["GITHUB_SHA"],
              "platform": "linux/amd64",
              "mainTagUpdated": os.environ["IMAGE_MAIN_UPDATED"] == "true",
          }
          output = Path("TestResults/imagem/image.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(details, indent=2) + "\n", encoding="utf-8")
          summary = (
              "## Imagem publicada no GHCR\n\n"
              f"- Tag do commit: `{details['shaTag']}`\n"
              f"- Digest validado: `{details['digestReference']}`\n"
              f"- Plataforma: `{details['platform']}`\n"
              f"- Tag main atualizada: `{details['mainTagUpdated']}`\n\n"
              "O smoke da imagem armazenada passou. O pacote inicial é privado; "
              "o pull requer autenticação com acesso de leitura ao pacote.\n"
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as report:
              report.write(summary)
          PY

      - name: Publicar metadados da imagem
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: imagem-ghcr
          path: TestResults/imagem/image.json
          if-no-files-found: error

      - name: Encerrar a sessão no GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io
