name: Qodana
on:
  workflow_call:
    secrets:
      QODANA_TOKEN_181914213:
        required: true
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'rob-*'
      - 'releases/*'

permissions:
  contents: read

jobs:
  qodana:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        with:
          pr-mode: false
          post-pr-comment: false
          upload-result: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_181914213 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
